# =============================================================================
# MY-IA - Configuration Nginx (reverse proxy)
# =============================================================================
# Genere automatiquement par scripts/deploy.sh
# Ne pas modifier manuellement - sera ecrase au prochain deploiement.
# =============================================================================

upstream myia_api {
    server 127.0.0.1:{{APP_PORT}};
}

# =============================================================================
# Frontend (port 80)
# =============================================================================
server {
    listen 80;
    server_name {{PUBLIC_HOST}};

    root {{INSTALL_DIR}}/app/UI-FRONT;
    index index.html;

    # Fichiers statiques partages
    location /shared/ {
        alias {{INSTALL_DIR}}/app/UI-SHARED/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API
    location /api/ {
        proxy_pass http://myia_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adaptes aux requetes LLM longues
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # SSE / Streaming pour le chat
    location /api/chat/stream {
        proxy_pass http://myia_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuration SSE
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Health check API
    location /health {
        proxy_pass http://myia_api;
        proxy_set_header Host $host;
    }

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/myia-frontend.access.log;
    error_log /var/log/nginx/myia-frontend.error.log;
}

# =============================================================================
# Backoffice Admin (port {{ADMIN_PORT}})
# =============================================================================
server {
    listen {{ADMIN_PORT}};
    server_name {{PUBLIC_HOST}};

    root {{INSTALL_DIR}}/app/UI-BACK;
    index index.html;

    # Fichiers statiques partages
    location /shared/ {
        alias {{INSTALL_DIR}}/app/UI-SHARED/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API (memes regles que le frontend)
    location /api/ {
        proxy_pass http://myia_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Admin SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/myia-admin.access.log;
    error_log /var/log/nginx/myia-admin.error.log;
}
