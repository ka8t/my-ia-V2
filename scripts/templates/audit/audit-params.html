<div class="audit-params" id="nav-params" data-nav-section="Paramètres">
    <h3>📋 Périmètre de l'audit</h3>
    <div class="params-grid">
        <div class="param-item">
            <span class="param-label">Dossiers analysés</span>
            <span class="param-value">{{include_paths}}</span>
        </div>
        <div class="param-item">
            <span class="param-label">Patterns exclus</span>
            <span class="param-value">{{exclude_patterns}}</span>
        </div>
        <div class="param-item">
            <span class="param-label">Mode</span>
            <span class="param-value"><strong>{{mode}}</strong></span>
        </div>
        <div class="param-item">
            <span class="param-label">Catégorie filtrée</span>
            <span class="param-value">{{only_category}}</span>
        </div>
        <div class="param-item">
            <span class="param-label">Règles désactivées</span>
            <span class="param-value">{{disabled_rules}}</span>
        </div>
        <div class="param-item param-full">
            <span class="param-label">Catégories</span>
            <span class="param-value">{{categories}}</span>
        </div>
    </div>
</div>
