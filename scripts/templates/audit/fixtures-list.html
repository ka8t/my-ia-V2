<div class="sub-group fixtures-list">
    <div class="sub-group-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="sub-group-icon">🧪</span>
        <h3>Détail des {{total}} fixtures testées</h3>
        <span class="sub-chevron">▶</span>
    </div>
    <div class="sub-group-content">
        <div class="fixtures-table-wrapper">
            <table class="fixtures-table">
                <thead>
                    <tr>
                        <th>Fixture</th>
                        <th>Type</th>
                        <th>Règle attendue</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    {{rows}}
                </tbody>
            </table>
        </div>
    </div>
</div>
