<div class="finding {{severity_class}}">
    <div class="finding-header">
        <span class="finding-rule">{{rule}}</span>
        <span class="finding-file">{{file}}:{{line}}</span>
    </div>
    <pre class="finding-code"><code>{{code}}</code></pre>
    <p class="finding-risk"><strong>Risque :</strong> {{risk}}</p>
    <p class="finding-solution"><strong>Solution :</strong> {{solution}}</p>
</div>
