<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title|default('MY-IA V2') }}{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">

  <!-- HTMX + Alpine.js -->
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/ext/sse.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3" defer></script>

  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
