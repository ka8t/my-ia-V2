<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ title|default('MY-IA') }}{% endblock %}</title>

  {# Design system — order matters: tokens → base → components #}
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">

  {# HTMX + Alpine.js (CDN) #}
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/ext/sse.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3" defer></script>

  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
