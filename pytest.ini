[pytest]
# Configuration pytest pour MY-IA

# Chemins de découverte des tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=20
    -W ignore::DeprecationWarning:pydantic._internal._config
    -W ignore::DeprecationWarning:passlib.utils
    -W ignore::DeprecationWarning:chromadb.api.models.CollectionCommon

# Markers personnalisés
markers =
    unit: Tests unitaires rapides
    integration: Tests d'intégration avec services externes
    slow: Tests lents (> 1s)
    api: Tests des endpoints API
    ingest_v2: Tests du système d'ingestion v2.0
    upload_v2: Tests de l'endpoint upload v2
    smoke: Tests de fumée critiques

# Filtrer les warnings des dépendances externes
filterwarnings =
    # Ignorer les DeprecationWarning des dépendances tierces
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:chromadb
    ignore::DeprecationWarning:pydantic
    # passlib crypt module (Python 3.13 deprecation)
    ignore:'crypt' is deprecated:DeprecationWarning
    # chromadb legacy embedding config
    ignore:legacy embedding function config:DeprecationWarning
    # SWIG types (hnswlib)
    ignore:builtin type Swig:DeprecationWarning
    ignore:builtin type swigvarlink:DeprecationWarning
    # SQLAlchemy
    ignore::sqlalchemy.exc.SAWarning
    # AsyncMock coroutines (dans les tests)
    ignore:coroutine.*was never awaited:RuntimeWarning

# Configuration coverage
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
